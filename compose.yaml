services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ledger}
      POSTGRES_USER: ${DB_USER:-ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger-postgres-data:
